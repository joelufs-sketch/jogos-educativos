<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matemática no Folclore - Escola Luiz Antonio</title>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1a237e 0%, #311b92 100%);
      min-height: 100vh; text-align: center; color: #fff; padding: 20px;
    }
    .hidden { display: none !important; }
    .container {
      margin-top: 20px; background: rgba(255,255,255,0.95); color: #1a237e;
      padding: 30px; border-radius: 25px; display: inline-block;
      max-width: 800px; width: 100%; box-shadow: 0 15px 35px rgba(0,0,0,0.4);
      border: 5px solid #ff9800;
    }
    h1 { font-size: 2.2rem; color: #e65100; margin-bottom: 10px; }
    .badge { background: #ff9800; color: white; padding: 5px 15px; border-radius: 20px; font-weight: bold; }
    input, button {
      padding: 14px; margin: 10px 0; font-size: 1rem; border-radius: 12px; border: 2px solid #ddd;
      width: 100%; max-width: 400px; display: block; margin-left: auto; margin-right: auto;
    }
    button {
      background: #ff9800; color: white; font-weight: bold; cursor: pointer; border: none;
      box-shadow: 0 4px 0 #ef6c00; transition: all 0.2s;
    }
    button:hover { background: #ffa726; transform: translateY(-2px); }
    .code-display { font-size: 3rem; font-weight: bold; color: #e65100; margin: 20px 0; border: 3px dashed #ff9800; padding: 10px; border-radius: 15px; }
    .option-btn { background: #fff3e0; border: 2px solid #ff9800; color: #e65100; cursor: pointer; padding: 18px; font-size: 1.1rem; font-weight: bold; width: 100%; }
    .option-btn:hover { background: #ffe0b2; }
    .math-info { background: #e3f2fd; color: #0d47a1; padding: 10px; border-radius: 10px; margin-top: 15px; font-size: 0.9rem; }
  </style>
</head>
<body>

  <div id="start-screen" class="container">
    <div style="font-size: 3rem;">🪁📐🎲</div>
    <h1>Matemática Folclórica</h1>
    <p>Geometria, Probabilidade e Medidas nas Tradições</p>
    <div style="margin-top: 30px;">
      <button onclick="goTo('professor-login-screen')">👨‍🏫 Área do Professor</button>
      <button onclick="goTo('student-login-screen')">👨‍🎓 Área do Aluno</button>
    </div>
  </div>

  <div id="professor-login-screen" class="container hidden">
    <h2>Acesso do Professor</h2>
    <input type="password" id="prof-password" placeholder="Senha do Professor">
    <button onclick="loginProfessor()">Entrar</button>
    <button onclick="location.reload()" style="background:#9e9e9e; box-shadow: 0 4px 0 #757575;">Voltar</button>
  </div>

  <div id="professor-panel" class="container hidden">
    <span class="badge">PAINEL DE CONTROLE</span>
    <h2>Código da Sala</h2>
    <div class="code-display" id="game-code">------</div>
    <div id="connected-players" style="margin: 15px 0; font-weight: bold; color: #ef6c00;">Aguardando alunos...</div>
    <button id="btn-start-game" onclick="startGameSession()" style="background:#2e7d32; box-shadow: 0 4px 0 #1b5e20;">🚀 INICIAR DESAFIO</button>
    <div id="professor-controls" class="hidden mt-4">
        <button onclick="nextQuestion()" style="background:#0288d1; box-shadow: 0 4px 0 #01579b;">➡️ PRÓXIMA PERGUNTA</button>
    </div>
  </div>

  <div id="student-login-screen" class="container hidden">
    <h2>Entrar no Desafio</h2>
    <input type="text" id="game-code-input" placeholder="Código da Sala">
    <input type="text" id="student-name" placeholder="Seu Nome">
    <button onclick="joinGame()">ENTRAR</button>
    <button onclick="location.reload()" style="background:#9e9e9e; box-shadow: 0 4px 0 #757575;">Voltar</button>
  </div>

  <div id="student-game-screen" class="container hidden text-left">
    <div id="game-status" style="background:#fff3e0; padding: 10px; border-radius: 10px; margin-bottom: 20px; text-align: center; font-weight: bold;">Aguardando...</div>
    <div id="question-div" class="hidden">
        <div id="current-question" style="font-size: 1.3rem; margin: 20px 0; font-weight: bold; color: #311b92;"></div>
        <div id="options-container" style="display: grid; grid-template-columns: 1fr; gap: 12px;"></div>
    </div>
    <div id="waiting-msg" style="text-align: center;">Prepare seu raciocínio matemático! 🧠</div>
  </div>

  <script>
    const firebaseConfig = { 
        apiKey: "AIzaSyB-fzXlO-PofqHCa0L7p14Y-YSOvAwG-WM",
        authDomain: "kahootjogosaojoao2.firebaseapp.com",
        projectId: "kahootjogosaojoao2",
        databaseURL: "https://kahootjogosaojoao2-default-rtdb.firebaseio.com",
        storageBucket: "kahootjogosaojoao2.firebasestorage.app" 
    };

    let database = null;
    let gameCodeGlobal = "";
    let currentIdx = 0;

    const questions = [
        {
            q: "GEOMETRIA: Ao observar uma PIPA (ou Papagaio) tradicional, qual figura geométrica plana é a base de sua estrutura?",
            a: "Losango",
            opts: ["Círculo", "Losango", "Cilindro", "Trapézio"],
            info: "A pipa possui dois pares de lados paralelos e diagonais que se cruzam, formando um losango."
        },
        {
            q: "GEOMETRIA: O PIÃO, ao girar perfeitamente, descreve a forma de qual sólido geométrico?",
            a: "Cone",
            opts: ["Cubo", "Esfera", "Cone", "Pirâmide"],
            info: "O pião tem uma base circular que afunila até um ponto, assemelhando-se a um cone."
        },
        {
            q: "PROBABILIDADE: Em um jogo de 'Escravos de Jó', se jogarmos com um dado para decidir quem começa, qual a probabilidade de sair o número 5?",
            a: "1 em 6",
            opts: ["1 em 2", "1 em 6", "1 em 10", "100%"],
            info: "Um dado comum tem 6 faces, logo, cada número tem 1 chance em 6."
        },
        {
            q: "MEDIDAS: Na amarelinha, se cada quadrado tem 50 cm de lado, qual a distância total (em metros) que a criança percorre ao pular 10 quadrados em linha reta?",
            a: "5 metros",
            opts: ["2 metros", "5 metros", "10 metros", "50 metros"],
            info: "10 quadrados x 50 cm = 500 cm. Convertendo para metros: 500 / 100 = 5 metros."
        },
        {
            q: "PROPORÇÃO: Uma receita de Cuscuz pede 2 xícaras de flocão para 1 xícara de água. Se dobrarmos a receita para 4 xícaras de flocão, quanta água usaremos?",
            a: "2 xícaras",
            opts: ["1 xícara", "2 xícaras", "3 xícaras", "4 xícaras"],
            info: "Se a proporção é 2:1, ao dobrar o flocão (4), dobramos a água (2)."
        },
        {
            q: "CONTAGEM: No folclore, o Saci tem apenas 1 perna. Em um grupo com 15 Sacis e 10 Curupiras (que têm 2 pernas), quantas pernas temos no total?",
            a: "35 pernas",
            opts: ["25 pernas", "35 pernas", "40 pernas", "50 pernas"],
            info: "(15x1) + (10x2) = 15 + 20 = 35 pernas."
        },
        {
            q: "GEOMETRIA: O formato da base de uma 'Casa de Farinha' tradicional, onde se faz o beiju, geralmente é um:",
            a: "Retângulo",
            opts: ["Triângulo", "Círculo", "Retângulo", "Hexágono"],
            info: "A maioria das construções rurais segue a planta retangular para otimizar o espaço das prensas."
        }
    ];

    try {
        firebase.initializeApp(firebaseConfig);
        database = firebase.database();
    } catch(e) { console.error("Firebase Error"); }

    function goTo(id) {
        document.querySelectorAll('.container').forEach(c => c.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
    }

    function loginProfessor() {
        if(document.getElementById('prof-password').value === 'professor123') {
            goTo('professor-panel');
            gameCodeGlobal = Math.random().toString(36).substr(2, 6).toUpperCase();
            document.getElementById('game-code').innerText = gameCodeGlobal;
            database.ref('games/' + gameCodeGlobal).set({ status: 'waiting', currentQ: 0 });
            database.ref('games/' + gameCodeGlobal + '/players').on('value', snap => {
                const p = snap.val() || {};
                document.getElementById('connected-players').innerText = "Alunos online: " + Object.keys(p).length;
            });
        } else { alert("Senha incorreta!"); }
    }

    function startGameSession() {
        database.ref('games/' + gameCodeGlobal).update({ status: 'playing', currentQ: 0 });
        document.getElementById('btn-start-game').classList.add('hidden');
        document.getElementById('professor-controls').classList.remove('hidden');
    }

    function nextQuestion() {
        currentIdx++;
        if(currentIdx < questions.length) {
            database.ref('games/' + gameCodeGlobal).update({ currentQ: currentIdx });
        } else {
            database.ref('games/' + gameCodeGlobal).update({ status: 'finished' });
        }
    }

    function joinGame() {
        const code = document.getElementById('game-code-input').value.trim().toUpperCase();
        const name = document.getElementById('student-name').value.trim();
        if(!name || !code) return alert("Preencha os campos!");

        database.ref('games/' + code).once('value', snap => {
            if(!snap.exists()) return alert("Sala não encontrada!");
            gameCodeGlobal = code;
            goTo('student-game-screen');
            database.ref('games/' + code + '/players/' + name.replace(/\./g, '_')).set({ name, score: 0 });
            
            database.ref('games/' + code).on('value', gSnap => {
                const data = gSnap.val();
                if(data.status === 'playing') startStudentGame(data.currentQ);
                else if(data.status === 'finished') {
                    document.getElementById('question-div').innerHTML = "<h2>Desafio Finalizado! 🏆</h2><p>A matemática está em tudo, até nas nossas brincadeiras!</p>";
                }
            });
        });
    }

    function startStudentGame(qIndex) {
        document.getElementById('game-status').innerText = "QUESTÃO " + (qIndex + 1);
        document.getElementById('waiting-msg').classList.add('hidden');
        document.getElementById('question-div').classList.remove('hidden');
        
        const q = questions[qIndex];
        document.getElementById('current-question').innerText = q.q;
        const container = document.getElementById('options-container');
        container.innerHTML = ""; 
        
        q.opts.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = "option-btn";
            btn.innerText = opt;
            btn.onclick = function() {
                if(opt === q.a) { alert("CERTO! 🌟\n" + q.info); } 
                else { alert("QUASE! 🪵\nA resposta era " + q.a + ".\n" + q.info); }
                container.innerHTML = "<div style='padding:20px; color:#666'>Resposta enviada! Aguarde o professor...</div>";
            };
            container.appendChild(btn);
        });
    }
  </script>
</body>
</html>
